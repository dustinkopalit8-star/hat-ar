<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AR Dayak Lite</title>
  
  <!-- Menggunakan versi yang lebih stabil untuk HP menengah -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.1/dist/mindar-face-aframe.prod.js"></script>

  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    #loading-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #1a1a1a; display: flex; flex-direction: column;
      align-items: center; justify-content: center; z-index: 999; color: white;
    }
    .hidden { display: none !important; }
    #hud { position: fixed; bottom: 20px; left: 0; width: 100%; z-index: 100; text-align: center; }
    #hat-selector { display: flex; overflow-x: auto; padding: 10px; gap: 10px; justify-content: center; }
    .hat-btn { background: rgba(255,255,255,0.2); border: 2px solid #fff; border-radius: 10px; padding: 5px; color: #fff; width: 60px; height: 60px; flex-shrink: 0; }
    .hat-btn.active { border-color: #ffd700; background: rgba(255,215,0,0.3); }
    .hat-btn img { width: 100%; height: 100%; object-fit: contain; }
  </style>
</head>

<body>
  <div id="loading-overlay">
    <div>Memuat AR (Mode Performa)...</div>
  </div>

  <a-scene 
    mindar-face="autoStart: true; uiLoading: no; uiError: no; filterMinCF: 0.01; filterBeta: 1" 
    embedded 
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    renderer="antialias: false; precision: medium; colorManagement: false; logarithmicDepthBuffer: false"
    light="defaultLightsEnabled: false">
    
    <a-assets>
        <!-- Load models here if needed, but we do it via JS for better control -->
    </a-assets>

    <a-camera active="false" position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Satu lampu sederhana (Ambient) agar GPU tidak berat -->
    <a-entity light="type: ambient; intensity: 1.2"></a-entity>
    <a-entity light="type: directional; intensity: 0.5" position="0 1 1"></a-entity>

    <!-- Hat container menggunakan Anchor dahi (10) -->
    <a-entity id="hat-root" mindar-face-target="anchorIndex: 10">
      <a-entity id="hat-container" position="0 0.1 0.1">
        <!-- Models will be toggled here -->
      </a-entity>
    </a-entity>
  </a-scene>

  <div id="hud">
    <div id="hat-selector"></div>
  </div>

  <script src="js/data.js"></script>
  <script>
    let currentId = 1;
    const hatContainer = document.getElementById('hat-container');

    // Buat selector
    const selector = document.getElementById('hat-selector');
    TOPI_DATA.forEach(topi => {
        const btn = document.createElement('div');
        btn.className = 'hat-btn' + (topi.id === 1 ? ' active' : '');
        btn.innerHTML = `<img src="${topi.gambar}">`;
        btn.onclick = () => {
            document.querySelectorAll('.hat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            showHat(topi.id);
        };
        selector.appendChild(btn);
    });

    function showHat(id) {
        // Sembunyikan semua
        document.querySelectorAll('.hat-model').forEach(el => el.setAttribute('visible', false));
        // Tampilkan yang dipilih
        const active = document.getElementById('hat-' + id);
        if (active) active.setAttribute('visible', true);
    }

    // Inisialisasi model
    window.addEventListener('load', () => {
        const scene = document.querySelector('a-scene');
        
        scene.addEventListener('arReady', () => {
            document.getElementById('loading-overlay').classList.add('hidden');
        });

        // Load semua model tapi sembunyikan
        TOPI_DATA.forEach(topi => {
            const ent = document.createElement('a-entity');
            ent.id = 'hat-' + topi.id;
            ent.className = 'hat-model';
            ent.setAttribute('gltf-model', `./assets/models/${topi.hatFile}`);
            ent.setAttribute('scale', '0.6 0.6 0.6');
            ent.setAttribute('visible', topi.id === 1);
            hatContainer.appendChild(ent);
        });
    });
  </script>
</body>
</html>
