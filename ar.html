<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>AR Try-On — Topi Adat Dayak Kenyah</title>
  <script>
    // PAKSA RESOLUSI RENDAH UNTUK PERFORMA
    const origGetUserMedia = navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);
    navigator.mediaDevices.getUserMedia = function (constraints) {
      if (constraints && constraints.video) {
        constraints.video = {
          ...(typeof constraints.video === 'object' ? constraints.video : {}),
          width: { ideal: 320 },
          height: { ideal: 240 },
          facingMode: 'user',
          frameRate: { ideal: 30 }
        };
      }
      return origGetUserMedia(constraints);
    };
  </script>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Nunito:wght@600;700&display=swap" />
  <link rel="stylesheet" href="css/ar.css" />
</head>

<body>
  <div id="loading-overlay">
    <div class="load-spinner"></div>
    <div class="load-title">Memuat AR Engine</div>
    <div class="load-sub">Mode Performa Tinggi Aktif...</div>
  </div>

  <div id="ar-container">
    <a-scene id="ar-scene"
      mindar-face="autoStart: true; uiLoading: false; uiError: false; filterMinCF: 0.1; filterBeta: 10" 
      embedded
      renderer="antialias: false; precision: low; powerPreference: high-performance; alpha: true; colorManagement: false"
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">

      <a-assets timeout="15000"></a-assets>
      <a-camera active="false" position="0 0 0" look-controls="enabled: false" wasd-controls="enabled: false"></a-camera>

      <!-- Hat container menggunakan Anchor 10 (Dahi) -->
      <a-entity id="hat-container" mindar-face-target="anchorIndex: 10">
        <a-entity id="hat-offset" position="0 0.05 0.05">

          <!-- HAT 1 -->
          <a-entity id="hat1" visible="true">
            <a-entity id="hat1-model" gltf-model="./assets/models/hat1.glb" scale="0.65 0.65 0.65" visible="false"></a-entity>
            <a-entity id="hat1-placeholder"><a-cylinder color="#8B5E3C" radius="0.1" height="0.1"></a-cylinder></a-entity>
          </a-entity>

          <!-- HAT 2 -->
          <a-entity id="hat2" visible="false">
            <a-entity id="hat2-model" gltf-model="./assets/models/hat2.glb" scale="0.65 0.65 0.65" visible="false"></a-entity>
            <a-entity id="hat2-placeholder"><a-cylinder color="#C0874F" radius="0.1" height="0.1"></a-cylinder></a-entity>
          </a-entity>

          <!-- HAT 3 -->
          <a-entity id="hat3" visible="false">
            <a-entity id="hat3-model" gltf-model="./assets/models/hat3.glb" scale="0.65 0.65 0.65" visible="false"></a-entity>
            <a-entity id="hat3-placeholder"><a-cone color="#6B8C42" radius-bottom="0.15" height="0.15"></a-cone></a-entity>
          </a-entity>

          <!-- HAT 4 -->
          <a-entity id="hat4" visible="false">
            <a-entity id="hat4-model" gltf-model="./assets/models/hat4.glb" scale="0.65 0.65 0.65" visible="false"></a-entity>
            <a-entity id="hat4-placeholder"><a-cylinder color="#A0784A" radius="0.1" height="0.1"></a-cylinder></a-entity>
          </a-entity>

          <!-- HAT 5 -->
          <a-entity id="hat5" visible="false">
            <a-entity id="hat5-model" gltf-model="./assets/models/hat5.glb" scale="0.65 0.65 0.65" visible="false"></a-entity>
            <a-entity id="hat5-placeholder"><a-cylinder color="#B8860B" radius="0.1" height="0.1"></a-cylinder></a-entity>
          </a-entity>

          <!-- HAT 6 -->
          <a-entity id="hat6" visible="false">
            <a-entity id="hat6-model" gltf-model="./assets/models/hat6.glb" scale="0.65 0.65 0.65" visible="false"></a-entity>
            <a-entity id="hat6-placeholder"><a-cylinder color="#7B5EA7" radius="0.1" height="0.1"></a-cylinder></a-entity>
          </a-entity>

          <!-- HAT 7 -->
          <a-entity id="hat7" visible="false">
            <a-entity id="hat7-model" gltf-model="./assets/models/hat7.glb" scale="0.65 0.65 0.65" visible="false"></a-entity>
            <a-entity id="hat7-placeholder"><a-cylinder color="#2C4A8C" radius="0.1" height="0.1"></a-cylinder></a-entity>
          </a-entity>

          <!-- HAT 8 -->
          <a-entity id="hat8" visible="false">
            <a-entity id="hat8-model" gltf-model="./assets/models/hat8.glb" scale="0.65 0.65 0.65" visible="false"></a-entity>
            <a-entity id="hat8-placeholder"><a-cylinder color="#6A1A44" radius="0.1" height="0.1"></a-cylinder></a-entity>
          </a-entity>

        </a-entity>
      </a-entity>
    </a-scene>
  </div>

  <!-- UI & INFO PANEL -->
  <div id="info-panel">
    <div class="info-panel-label">Topi Aktif</div>
    <div class="info-panel-name" id="ip-name">—</div>
    <div class="info-panel-divider"></div>
    <a class="info-panel-link" id="ip-link" href="#">Info Lengkap</a>
  </div>

  <div id="face-status" class="face-warning face-status-hidden">
    <p>Arahkan wajah ke kamera</p>
  </div>

  <div id="hud">
    <div class="hud-top">
      <button class="hud-btn" onclick="stopAR()">Kembali</button>
    </div>
    <div class="hud-bottom">
      <div id="hat-selector"></div>
      <div class="ar-actions">
        <button class="ar-action-btn primary" onclick="takeScreenshot()">Ambil Foto</button>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/ar.js"></script>
</body>
</html>
